<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms Skeleton</title>
  </head>
  <body>
    <form name="contact" method="POST" action="/thank-you" netlify-honeypot="bot-field" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" type="text" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <select name="topic">
        <option value="rate-update">Report a Rate Change</option>
        <option value="calculator-request">Request a Calculator</option>
        <option value="sponsorship">Sponsorship / Partnership</option>
        <option value="general">General Question</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
